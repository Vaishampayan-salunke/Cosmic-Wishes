<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cosmic Wishes — Every wish is a star</title>
<meta name="description" content="Launch a wish into a living galaxy. Every wish becomes a star or a planet — send one to a friend, seal one in a bottle, and watch the sky fill with dreams.">
<meta name="theme-color" content="#04050d">
<meta property="og:title" content="Cosmic Wishes — Every wish is a star">
<meta property="og:description" content="Launch a wish into a living galaxy and send it to someone you love.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2305061a'/%3E%3Cpath d='M32 9l5.6 15.4L53 26l-12.3 9.6L44.8 52 32 42.6 19.2 52l4.1-16.4L11 26l15.4-1.6z' fill='%23ffd479'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="sky" aria-label="Interactive sky of wishes. Drag to explore, scroll or pinch to zoom."></canvas>

<!-- LANDING -->
<section id="landing" aria-label="Welcome">
  <div class="landing-inner">
    <div class="eyebrow"><span class="spark">✦</span> <span id="landing-count">thousands of</span> wishes are already glowing</div>
    <h1>Every wish<br>is a <em>star.</em></h1>
    <p class="lede">Write what you hope for. Watch it streak across the sky and settle among everyone else's dreams — then send it to someone who needs to read it.</p>
    <div class="landing-actions">
      <button class="btn primary big" id="landing-make">✦ Make a Wish</button>
      <button class="btn ghost big" id="landing-explore">Explore the sky</button>
    </div>
    <div class="loading-line" id="loading-line"><span class="dot"></span> Summoning the stars…</div>
  </div>
</section>

<!-- TOP BAR -->
<header id="topbar">
  <button class="brand" id="brand" aria-label="Cosmic Wishes home"><span class="brand-star">✦</span><span class="brand-name">Cosmic Wishes</span></button>
  <nav class="tools" aria-label="Tools">
    <button class="tool" id="t-search" title="Search & filter" aria-label="Search and filter">🔍</button>
    <button class="tool" id="t-wotd" title="Wish of the day" aria-label="Wish of the day">🌟</button>
    <button class="tool" id="t-timelapse" title="Time-lapse" aria-label="Time-lapse">⏳</button>
    <button class="tool" id="t-sound" title="Sound" aria-label="Toggle sound">🔇</button>
    <button class="tool" id="t-bell" title="Notifications" aria-label="Notifications">🔔<span class="badge" id="bell-badge" hidden>0</span></button>
    <button class="tool profile-btn" id="t-profile" title="Profile" aria-label="Profile or sign in">👤</button>
  </nav>
</header>

<div id="filter-chip" class="chip-floating" hidden></div>
<div id="catch-chip" class="chip-floating catch" hidden></div>
<div id="connect-banner" class="chip-floating connect" hidden></div>

<!-- TIME-LAPSE BAR -->
<div id="tl-bar" hidden>
  <button class="tool" id="tl-play" aria-label="Play or pause">⏸</button>
  <input id="tl-range" type="range" min="0" max="1000" value="0" aria-label="Time-lapse position">
  <span id="tl-date">—</span>
  <button class="tool" id="tl-close" aria-label="Exit time-lapse">✕</button>
</div>

<!-- SEARCH PANEL -->
<section id="search-panel" hidden aria-label="Search wishes">
  <div class="search-row">
    <input id="search-input" type="search" placeholder="Search a word, a place, a feeling…" autocomplete="off">
    <button class="icon-btn" id="search-close" aria-label="Close search">✕</button>
  </div>
  <div class="cat-chips" id="search-cats"></div>
  <div class="search-flags"><label class="check"><input type="checkbox" id="search-mine"> My stars only</label><span id="search-count" class="muted"></span></div>
  <ul id="search-results" class="results"></ul>
</section>

<!-- BOTTOM HUD -->
<div id="counter" aria-live="polite"></div>
<button id="cta">✦ Make a Wish</button>
<div id="zoomctl">
  <button class="tool" id="z-in" aria-label="Zoom in">＋</button>
  <button class="tool" id="z-out" aria-label="Zoom out">－</button>
  <button class="tool" id="z-uni" title="Universe view" aria-label="Universe view">🌌</button>
  <button class="tool" id="z-home" title="Back to centre" aria-label="Back to centre">◎</button>
</div>

<div id="tooltip" hidden></div>
<aside id="card" hidden aria-live="polite"></aside>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<div id="demo-badge" hidden></div>
<footer id="credit">Built with <span aria-label="love">♥</span> by Vaishampayan Salunke</footer>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#04050d;padding:24px;text-align:center">Cosmic Wishes needs JavaScript to draw the sky.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
